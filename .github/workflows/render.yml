name: Render Remotion Reels

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Render Shot 04
        run: npx remotion render src/index.tsx Shot04 out/shot-04.mp4 --codec=h264 --pixel-format=yuv420p
      - name: Upload Shot 04 MP4
        uses: actions/upload-artifact@v4
        with:
          name: shot-04-mp4
          path: out/shot-04.mp4
