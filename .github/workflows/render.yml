name: Render Remotion Reels

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Render first project - full motion graphics
        run: npx remotion render src/index.tsx CreatorAudienceStyleDNA out/creator-audience-full.mp4 --codec=h264 --pixel-format=yuv420p
      - name: Render clip 01
        run: npx remotion render src/index.tsx CreatorAudienceStyleDNA out/clip-01-attention-trust.mp4 --codec=h264 --pixel-format=yuv420p --frames=0-149
      - name: Render clip 02
        run: npx remotion render src/index.tsx CreatorAudienceStyleDNA out/clip-02-creator-advantage.mp4 --codec=h264 --pixel-format=yuv420p --frames=150-299
      - name: Render clip 03
        run: npx remotion render src/index.tsx CreatorAudienceStyleDNA out/clip-03-business-asset.mp4 --codec=h264 --pixel-format=yuv420p --frames=300-449
      - name: Package clips
        run: |
          mkdir -p package
          cp out/creator-audience-full.mp4 package/
          cp out/clip-01-attention-trust.mp4 package/
          cp out/clip-02-creator-advantage.mp4 package/
          cp out/clip-03-business-asset.mp4 package/
          cd package
          zip -r ../creator-audience-first-project.zip .
      - name: Upload First Project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: creator-audience-first-project
          path: creator-audience-first-project.zip
      - name: Upload individual MP4 clips
        uses: actions/upload-artifact@v4
        with:
          name: creator-audience-individual-mp4s
          path: |
            out/creator-audience-full.mp4
            out/clip-01-attention-trust.mp4
            out/clip-02-creator-advantage.mp4
            out/clip-03-business-asset.mp4
